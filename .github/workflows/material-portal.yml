name: Material portal PoP

on:
  pull_request:
    paths:
      - "candidates/material-portal/**"
      - "candidates/sphinx-needs/**"
      - "src/portal.py"
      - "tests/verify_material_portal.py"
      - "docs/06-material-portal.md"
      - ".github/workflows/material-portal.yml"
  push:
    branches:
      - main
    paths:
      - "candidates/material-portal/**"
      - "candidates/sphinx-needs/**"
      - "src/portal.py"
      - "tests/verify_material_portal.py"
      - "docs/06-material-portal.md"
      - ".github/workflows/material-portal.yml"

permissions:
  contents: read

jobs:
  qualify:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned documentation stack
        run: |
          python -m pip install             -r candidates/sphinx-needs/requirements.txt             -r candidates/material-portal/requirements.txt

      - name: Export validated engineering graph
        run: |
          sphinx-build -W --keep-going -b needs             candidates/sphinx-needs/source             bld/material-portal/sphinx

      - name: Generate portal source
        run: |
          python -m src.portal generate             bld/material-portal/sphinx/needs.json             candidates/material-portal             bld/material-portal/docs

      - name: Build static Material portal
        run: |
          mkdocs build --strict             --config-file candidates/material-portal/mkdocs.yml

      - name: Verify portal output
        run: python tests/verify_material_portal.py bld/material-portal

      - name: Capture installed dependency set
        run: python -m pip freeze > bld/material-portal/pip-freeze.txt

      - name: Upload portal evidence
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: material-portal-evidence
          path: bld/material-portal/
          if-no-files-found: error

name: Experiment review site

on:
  pull_request:
    paths:
      - "pages/**"
      - "candidates/material-portal/**"
      - "candidates/sphinx-needs/**"
      - "src/portal.py"
      - "tests/verify_material_portal.py"
      - "fixtures/authoring/**"
      - "candidates/authoring-review/**"
      - "src/authoring.py"
      - "src/authoring_review.py"
      - "src/eng_graph.py"
      - "fixtures/navigation/**"
      - "candidates/navigation-review/**"
      - "src/navigation.py"
      - "tests/test_navigation.py"
      - ".github/workflows/pages.yml"
  push:
    branches:
      - main
    paths:
      - "pages/**"
      - "candidates/material-portal/**"
      - "candidates/sphinx-needs/**"
      - "src/portal.py"
      - "tests/verify_material_portal.py"
      - "fixtures/authoring/**"
      - "candidates/authoring-review/**"
      - "src/authoring.py"
      - "src/authoring_review.py"
      - "src/eng_graph.py"
      - "fixtures/navigation/**"
      - "candidates/navigation-review/**"
      - "src/navigation.py"
      - "tests/test_navigation.py"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-review-site:
    runs-on: ubuntu-latest

    steps:
      - name: Check out source
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install pinned documentation stack
        run: |
          python -m pip install \
            -r candidates/sphinx-needs/requirements.txt \
            -r candidates/material-portal/requirements.txt

      - name: Export validated engineering graph
        run: |
          sphinx-build -W --keep-going -b needs \
            candidates/sphinx-needs/source \
            bld/review/sphinx

      - name: Generate portal source
        run: |
          python -m src.portal generate \
            bld/review/sphinx/needs.json \
            candidates/material-portal \
            bld/material-portal/docs

      - name: Build portal step
        run: |
          mkdocs build --strict \
            --config-file candidates/material-portal/mkdocs.yml

      - name: Export Step 05 authoring graph
        run: |
          mkdir -p bld/authoring
          python -m src.authoring extract \
            fixtures/authoring/compact-metadata.md \
            fixtures/authoring/reference.json \
            bld/authoring/compact-graph.json \
            --mode compact

      - name: Generate Step 05 authoring review
        run: |
          python -m src.authoring_review \
            fixtures/authoring/compact-metadata.md \
            fixtures/authoring/sidecar-content.md \
            fixtures/authoring/sidecar-metadata.json \
            fixtures/authoring/native-myst.md \
            bld/authoring/compact-graph.json \
            bld/authoring/review-docs

      - name: Build Step 05 authoring review
        run: |
          mkdocs build --strict \
            --config-file candidates/authoring-review/mkdocs.yml

      - name: Generate Step 06 clickable real architecture
        run: |
          python -m unittest tests.test_navigation
          python -m src.navigation bld/navigation-review

      - name: Assemble experiment review site
        shell: bash
        run: |
          set -euo pipefail

          site="bld/pages-site"
          rm -rf "$site"
          mkdir -p "$site/assets" \
            "$site/steps/04-portal-workspace" \
            "$site/steps/05-real-markdown-authoring" \
            "$site/steps/06-clickable-real-architecture" \
            "$site/review"

          cp pages/index.html "$site/index.html"
          cp pages/assets/experiment.css "$site/assets/experiment.css"
          cp -a bld/material-portal/site/. "$site/steps/04-portal-workspace/"
          cp -a bld/authoring/review-site/. "$site/steps/05-real-markdown-authoring/"
          cp -a bld/navigation-review/. "$site/steps/06-clickable-real-architecture/"

          cat > "$site/review/README.md" <<'EOF'
          # Experiment 007 review output

          Start at `index.html`.

          ## Step 04 — Portal & workspace

          Open:

          `steps/04-portal-workspace/explorer/index.html`

          Review whether:

          - architecture context and selected-object detail remain understandable together;
          - navigation between related engineering objects is discoverable;
          - the page uses horizontal space effectively;
          - generated object pages remain readable;
          - traceability adds context rather than visual noise.

          The retained browser screenshot is `step-04-TimingNode.png`.

          ## Step 05 — Real Markdown authoring

          Open:

          `steps/05-real-markdown-authoring/index.html`

          Review whether:

          - compact metadata still feels like normal engineering Markdown;
          - sidecar metadata creates too much distance from the owning prose;
          - native MyST remains acceptable in normal GitHub/Markdown review;
          - the generated graph/backlinks add useful navigation around use cases.

          The retained browser screenshot is `step-05-authoring.png`.

          ## Step 06 — Clickable real architecture

          Open:

          `steps/06-clickable-real-architecture/index.html?object=TimingNode`

          Review whether:

          - the real layered architecture is a useful navigation surface;
          - TimingNode exposes UC-001 and UC-014 without a hand-maintained lookup table;
          - opening UC-001 keeps useful architecture context visible;
          - requirement/verification links add context without overwhelming the narrative;
          - authoritative-source links clearly distinguish stable anchors from pinned line fallbacks.

          Retained screenshots:
          - `step-06-TimingNode.png`
          - `step-06-UC-001.png`
          EOF

      - name: Verify assembled site
        shell: bash
        run: |
          set -euo pipefail
          test -f bld/pages-site/index.html
          test -f bld/pages-site/steps/04-portal-workspace/index.html
          test -f bld/pages-site/steps/04-portal-workspace/explorer/index.html
          test -f bld/pages-site/steps/04-portal-workspace/objects/TimingNode/index.html
          test -f bld/pages-site/steps/05-real-markdown-authoring/index.html
          test -f bld/pages-site/steps/05-real-markdown-authoring/compact/index.html
          test -f bld/pages-site/steps/05-real-markdown-authoring/sidecar/index.html
          test -f bld/pages-site/steps/05-real-markdown-authoring/native-myst/index.html
          test -f bld/pages-site/steps/06-clickable-real-architecture/index.html
          test -f bld/pages-site/steps/06-clickable-real-architecture/navigation-model.json
          grep -q 'data-engineering-id="TimingNode"' bld/pages-site/steps/06-clickable-real-architecture/index.html
          grep -q 'steps/04-portal-workspace/' bld/pages-site/index.html
          grep -q 'steps/05-real-markdown-authoring/' bld/pages-site/index.html
          grep -q 'steps/06-clickable-real-architecture/' bld/pages-site/index.html
          python tests/verify_material_portal.py bld/material-portal

      - name: Capture representative browser review
        shell: bash
        run: |
          set -euo pipefail

          python -m http.server 8765 \
            --bind 127.0.0.1 \
            --directory bld/pages-site \
            > bld/pages-site/review/browser-server.log 2>&1 &
          server_pid=$!
          trap 'kill "$server_pid" 2>/dev/null || true' EXIT

          python - <<'PY'
          import time
          import urllib.request

          url = "http://127.0.0.1:8765/steps/04-portal-workspace/explorer/?object=TimingNode"
          for _ in range(20):
              try:
                  urllib.request.urlopen(url, timeout=1).read(1)
                  break
              except Exception:
                  time.sleep(0.25)
          else:
              raise SystemExit("review site did not become ready")
          PY

          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || true)"
          if [ -z "$chrome" ]; then
            echo "No Chrome/Chromium executable available on runner"
            exit 1
          fi

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2000 \
            --window-size=1600,1000 \
            --screenshot=bld/pages-site/review/step-04-TimingNode.png \
            "http://127.0.0.1:8765/steps/04-portal-workspace/explorer/?object=TimingNode"

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2000 \
            --window-size=1600,1000 \
            --screenshot=bld/pages-site/review/step-05-authoring.png \
            "http://127.0.0.1:8765/steps/05-real-markdown-authoring/"

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --window-size=1800,1100 \
            --screenshot=bld/pages-site/review/step-06-TimingNode.png \
            "http://127.0.0.1:8765/steps/06-clickable-real-architecture/?object=TimingNode"

          "$chrome" \
            --headless \
            --no-sandbox \
            --disable-gpu \
            --disable-dev-shm-usage \
            --virtual-time-budget=2500 \
            --window-size=1800,1100 \
            --screenshot=bld/pages-site/review/step-06-UC-001.png \
            "http://127.0.0.1:8765/steps/06-clickable-real-architecture/?object=UC-001"

      - name: Write human review summary
        shell: bash
        run: |
          cat >> "$GITHUB_STEP_SUMMARY" <<'EOF'
          # Experiment 007 review site

          The workflow built a human-reviewable documentation site, not only pass/fail evidence.

          ## What to review

          **Step 04 — Portal & workspace**

          Check whether architecture context and selected-object detail remain understandable together.

          **Step 05 — Real Markdown authoring**

          Compare compact metadata, sidecar metadata and native MyST as normal engineering source.
          Pay special attention to readability, source/metadata distance and generated backlinks.

          **Step 06 — Clickable real architecture**

          Click TimingNode and then UC-001/UC-014. Judge whether the real architecture remains useful context while reading the real narrative.

          ## Review output

          Download artifact **`review-output`** and open `index.html`.

          After this change is merged to `main`, the same output is published through GitHub Pages.
          EOF

      - name: Upload human review output
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: review-output
          path: bld/pages-site/
          if-no-files-found: error
          retention-days: 14

      - name: Configure Pages
        if: github.event_name != 'pull_request'
        uses: actions/configure-pages@983d7736d9b0ae728b81ab479565c72886d7745b # v5

      - name: Upload Pages artifact
        if: github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4
        with:
          path: bld/pages-site

  deploy-pages:
    if: github.event_name != 'pull_request'
    needs: build-review-site
    runs-on: ubuntu-latest

    permissions:
      pages: write
      id-token: write

    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy experiment review site
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4

      - name: Publish live review URL
        run: |
          echo "## Live review site" >> "$GITHUB_STEP_SUMMARY"
          echo "" >> "$GITHUB_STEP_SUMMARY"
          echo "${{ steps.deployment.outputs.page_url }}" >> "$GITHUB_STEP_SUMMARY"
